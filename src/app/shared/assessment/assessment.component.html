<div class="assessment-container">
    <div class="header">
        <img src="assets/icons/back-arrow.png" alt="Back Icon" class="back-button" (click)="onBackClick()" />
        <div class="title-container">
            <h1>{{ subtitle }}</h1>
            <img src="assets/icons/long-arrow.png" alt="Arrow" class="long-arrow" />
            <h2>Assessment</h2>
        </div>
        <img src="assets/icons/category-icon.png" alt="Category Icon" class="header-icon" />
    </div>

    <!-- Total Stats Section -->
    <div class="total-stats">
        <div class="stat-box">
            <img src="assets/icons/bulb-icon.png" alt="Quiz Icon" class="stat-icon" />
            <p><span>Quiz: 1 <span style="color: #f7931e;">/106 SOLVED</span></span></p>
        </div>
        <div class="stat-box">
            <img src="assets/icons/credits-icon.png" alt="credits Icon" class="stat-icon" />
            <p><span>Credits: 3<span style="color: #f7931e;"> EARNED</span></span></p>
        </div>
    </div>

    <!-- Questions -->
    <div *ngFor="let question of questions; let i = index" class="question-card">
        <!-- Question Number -->
        <div class="question-number">
            {{ i + 1 }}
        </div>

        <!-- Question Text -->
        <div class="question-text">
            <b>Q.</b> {{ question.text }}
        </div>

        <!-- Options -->
        <div class="options-container">
            <label *ngFor="let option of question.options" class="option"
                [class.selected]="question.selectedOption === option.text">
                <span class="option-text">{{ option.text }}</span>
                <input type="radio" [name]="'question-' + i" [value]="option.text"
                    [(ngModel)]="question.selectedOption" />
            </label>
        </div>
    </div>

    <!-- Show Score Button -->
    <div class="submit-container">
        <button class="submit-btn" (click)="submitAnswers()">
            Show Score!
            <span class="submit-icon">&#10132;</span>
        </button>
    </div>
</div>
