<div class="details-container">
    <!-- Fixed Header -->
    <div class="header">
        <img src="assets/icons/back-arrow.png" alt="Back Icon" class="back-button" (click)="onBackClick()" />
        <div class="title-container">
            <h1>{{ title }}</h1>
            <img src="assets/icons/long-arrow.png" alt="Arrow" class="long-arrow" />
            <h2>{{ subtitle }}</h2>
        </div>
        <img src="assets/icons/category-icon.png" alt="Category Icon" class="header-icon" />
    </div>

    <!-- Total Stats Section -->
    <div class="total-stats">
        <div class="stat-box">
            <img src="assets/icons/bulb-icon.png" alt="Quiz Icon" class="stat-icon" />
            <p>Total<br><span>Quiz: 1 / 106 Solved</span></p>
        </div>

        <div class="stat-box">
            <img src="assets/icons/credits-icon.png" alt="credits Icon" class="stat-icon" />
            <p>Total<br><span>Credits: 3 Scored</span></p>
        </div>
    </div>

    <!-- Swipeable and Scrollable Content -->
    <div #contentContainer class="content" style="height: 100%;">
        <div *ngIf="articles.length > 0" class="card">
            <div class="card-header">
                <h2>{{ articles[currentIndex].articleTitle }}</h2>
                <div class="article-icons">
                    <img src="assets/icons/bookmark-icon.png" alt="Bookmark" class="header-article-icon" />
                    <img src="assets/icons/share-icon.png" alt="Share" class="header-article-icon" />
                </div>
            </div>

            <div class="card-body">
                <ng-container *ngIf="articles[currentIndex].isVideo; else imageTemplate">
                    <iframe [src]="articles[currentIndex].articleImage | safeUrl" height="260px" width="50%"
                        frameborder="0"></iframe>
                </ng-container>
                <ng-template #imageTemplate>
                    <img [src]="articles[currentIndex].articleImage" alt="{{ articles[currentIndex].articleTitle }}"
                        class="card-image" />
                </ng-template>

                <div class="card-content">
                    <p>{{ articles[currentIndex].articleContent }}</p>
                    <button *ngIf="title === 'International Zone' || title === 'Entrepreneur Zone'; else testButton"
                        class="test-button" (click)="navigateToRegister()">
                        Register
                    </button>

                    <ng-template #testButton>
                        <button class="test-button" (click)="navigateToTest(articles[currentIndex])">
                            Test Yourself
                        </button>
                    </ng-template>
                </div>
            </div>

            <div class="card-footer">
                <p (click)="nextCard()" style="cursor: pointer;">
                    Swipe up for more
                    <span class="material-icons">arrow_upward</span>
                </p>
                <div class="footer-icons">
                    <span class="material-icons">thumb_up</span>
                    <span class="material-icons">thumb_down</span>
                </div>
            </div>
        </div>
    </div>
</div>
