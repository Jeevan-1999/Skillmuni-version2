<div class="performance-section">
    <div class="heading-section">
        <div class="section-header">
            <div class="section-line"></div> <!-- Horizontal line in the same row -->
            <h2 class="section-title">
                My Performance
            </h2>
            <div class="section-line"></div> <!-- Horizontal line in the same row -->
        </div>
        <div class="profile-card">
            <div class="profile-info">
                <img [src]="userProfileImg" alt="" class="name-logo">
                <h3>{{name}}</h3>
                <p class="profile-level">GRADUATE LEVEL</p>
            </div>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
        <!-- Badges -->
        <div class="badges-container">
            <div class="badge-card">
                <img src="assets/icons/badge-gold.png" alt="Gold Badge">
                <p>0</p>
            </div>
            <div class="badge-card">
                <img src="assets/icons/badge-silver.png" alt="Silver Badge">
                <p>0</p>
            </div>
            <div class="badge-card">
                <img src="assets/icons/badge-bronze.png" alt="Bronze Badge">
                <p>0</p>
            </div>
            <div class="badge-title">BADGES WON</div>
        </div>

        <!-- Other Stats -->
        <div class="other-stats">
            <div class="stat-card">
                <img src="assets/icons/goal-icon.png" alt="Goals">
                <span>GOALS</span>
                <p>0</p>
            </div>
            <div class="stat-card">
                <img src="assets/icons/gem-icon.png" alt="Gems">
                <span>GEMS</span>
                <p>0</p>
            </div>
            <div class="stat-card">
                <img src="assets/icons/wallet-icon.png" alt="Wallet">
                <span>WALLET</span>
                <p>0</p>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <div class="action-button">
            <img src="assets/icons/orange-bookmark-icon.png" alt="Bookmark">
            <p>View Bookmarked</p>
        </div>
        <div class="action-button">
            <img src="assets/icons/reward-icon.png" alt="Rewards">
            <p>View Available Rewards</p>
        </div>
        <div class="action-button">
            <img src="assets/icons/assessment-icon.png" alt="Assessment">
            <p>Assessment Score</p>
        </div>
        <div class="action-button">
            <img src="assets/icons/redeemed-icon.png" alt="Redeemed">
            <p>Rewards Redeemed</p>
        </div>
    </div>
</div>
