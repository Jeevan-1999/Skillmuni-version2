<div class="category-container" *ngIf="!isCardClicked">
    <div class="header">
        <img src="assets/icons/back-arrow.png" alt="Back Icon" routerLink="/learning-zone" class="back-button" />
        <div class="title-container">
            <h1>Learning Zone</h1>
            <img src="assets/icons/long-arrow.png" alt="Arrow" class="long-arrow" />
            <h2>{{ title }}</h2>
        </div>
        <img src="assets/icons/category-icon.png" alt="Category Icon" class="header-icon" />
    </div>

    <div *ngIf="externalUrl; else defaultContent">
        <iframe [src]="externalUrl" width="100%" height="600px" frameborder="1"></iframe>
    </div>

    <ng-template #defaultContent>
        <div class="status-container">
            <div class="status-card quiz-status">
                <img src="assets/icons/bulb-icon.png" alt="Quiz Icon">
                <span>Quiz: <b>1 / <span class="highlight">106</span> Solved</b></span>
            </div>

            <div class="status-card goal-status">
                <img src="assets/icons/ball-icon.png" alt="Goal Icon">
                <span>Goal: <b>3 <span class="highlight">Scored</span></b></span>
            </div>
        </div>

        <div class="cards-container">
            <div class="card" *ngFor="let card of learnAndPlayCards"
                (click)="fetchBriefListWithAcademy(card.tileCode, id_academic_tile, card.title)">
                <div class="card-image-wrapper">
                    <img [src]="card.image" alt="{{ card.title }}" class="card-image" />
                </div>
                <div class="card-content">
                    <p class="card-title">{{ card.title | uppercase }}</p>
                </div>
            </div>
        </div>

        <div class="coming-soon">
            <img src="assets/icons/coming-soon.png" alt="Coming Soon Icon" class="coming-soon-image" />
        </div>
    </ng-template>
</div>

<app-zone-articles *ngIf="isCardClicked" [title]="'Learning Zone'" [subtitle]="selectedCardTitle" [articles]="articles"
    (backClicked)="onBackClick()">
</app-zone-articles>
